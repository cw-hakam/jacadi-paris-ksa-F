# Deployment is handled automatically by Vercel's GitHub App integration.
#
# When you push to `main`, Vercel detects the change and deploys automatically.
# No secrets or tokens are needed here — configure the project once in:
#   https://vercel.com/dashboard → Import Project → Connect GitHub repo
#
# This CI workflow only runs quality checks (lint + build) as a gate.
# The actual deployment is triggered natively by Vercel after CI passes.
#
# If you need to trigger Vercel via GitHub Actions (e.g. monorepo setup),
# add these secrets to GitHub → Settings → Secrets → Actions:
#   VERCEL_TOKEN      — from vercel.com/account/tokens
#   VERCEL_ORG_ID     — from vercel.com/account → Settings → General
#   VERCEL_PROJECT_ID — from Project Settings → General
# Then uncomment the workflow below.

